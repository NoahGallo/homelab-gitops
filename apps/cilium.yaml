apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.io
spec:
  project: default
  sources:
    - repoURL: https://helm.cilium.io
      chart: cilium
      targetRevision: "1.17.4"
      helm:
        releaseName: cilium
        valueFiles:
          - $values/platform/cilium/values.yaml
    - repoURL: https://github.com/NoahGallo/homelab-gitops
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: false    # Never auto-prune CNI resources — would break networking
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
