apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.io
spec:
  project: default
  sources:
    - repoURL: https://kubernetes-sigs.github.io/external-dns/
      chart: external-dns
      targetRevision: "1.20.0"
      helm:
        releaseName: external-dns
        valueFiles:
          - $homelab/platform/external-dns/values.yaml
    - repoURL: https://github.com/NoahGallo/homelab-gitops
      targetRevision: HEAD
      ref: homelab
    - repoURL: https://github.com/NoahGallo/homelab-gitops
      targetRevision: HEAD
      path: platform/external-dns/config
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
