apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.io
spec:
  project: default
  sources:
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: "v1.20.2"
      helm:
        releaseName: cert-manager
        valueFiles:
          - $homelab/platform/cert-manager/values.yaml
    - repoURL: https://github.com/NoahGallo/homelab-gitops
      targetRevision: HEAD
      ref: homelab
    - repoURL: https://github.com/NoahGallo/homelab-gitops
      targetRevision: HEAD
      path: platform/cert-manager/config
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
