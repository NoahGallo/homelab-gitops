apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium-config
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.io
spec:
  project: default
  source:
    repoURL: https://github.com/NoahGallo/homelab-gitops
    targetRevision: HEAD
    path: platform/cilium-config
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: false    # Never auto-prune network resources
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
