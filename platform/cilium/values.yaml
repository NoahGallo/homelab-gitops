# Cilium v1.17.4 — bootstrap values for Talos + homelab
# These values are used for the initial `cilium install`.
# ArgoCD will manage Cilium going forward using the same values from homelab-gitops.

# --- Talos compatibility (required) ---
ipam:
  mode: kubernetes

kubeProxyReplacement: true
k8sServiceHost: 192.168.178.10
k8sServicePort: 6443

cgroup:
  autoMount:
    enabled: false   # Talos manages cgroups itself
  hostRoot: /sys/fs/cgroup

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

# --- Routing ---
# Native routing: no VXLAN overhead, works because all nodes share 192.168.178.0/24
routingMode: native
autoDirectNodeRoutes: true
ipv4NativeRoutingCIDR: 10.244.0.0/16

# --- Observability ---
hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
  metrics:
    enabled:
      - dns
      - drop
      - tcp
      - flow
      - port-distribution
      - icmp
      - httpV2

# --- Gateway API ---
gatewayAPI:
  enabled: true

# --- L2 announcements for LoadBalancer services ---
l2announcements:
  enabled: true

externalIPs:
  enabled: true
